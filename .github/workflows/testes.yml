name: testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Dependências do núcleo
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy Pillow opencv-python-headless PyYAML

      - name: Testes (sem internet e sem gasto; os que dependem de pacotes opcionais são pulados)
        shell: bash
        run: |
          falhas=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            python "$t" || falhas=$((falhas+1))
            echo "::endgroup::"
          done
          echo "suítes com falha: $falhas"
          test "$falhas" -eq 0
